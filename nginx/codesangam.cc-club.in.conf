server {
    listen 80;
    listen [::]:80;
    server_name codesangam.cc-club.in www.codesangam.cc-club.in;

    root /var/www/codesangam.tailnet/html;
    index index.html;

    # Backend API. No trailing URI on proxy_pass, so /api/... is passed
    # through untouched and matches the Go server's BASE_URL mount point.
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router: unknown paths fall back to index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed CRA assets — safe to cache forever.
    location ^~ /static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
